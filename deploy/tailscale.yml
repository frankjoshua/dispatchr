# dispatchr at its own tailnet name, https://<TS_HOSTNAME>.<tailnet>.ts.net/, from a Tailscale container
# beside it (no VM of its own, no Tailscale needed on the host):
#   docker compose -f deploy/docker-compose.yml -f deploy/tailscale.yml up -d --build
# First start: approve the device at the login URL in `docker logs dispatchr-tailscale` within
# TS_BOOT_TIMEOUT (15 min; or set TS_AUTHKEY); the login is kept in the state volume. That is another
# origin than rostr's, so build with VITE_ROSTR_URL (rostr's tailnet address) and add
# https://<TS_HOSTNAME>.<tailnet>.ts.net to rostr's ROSTR_CORS_ORIGINS.
services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: dispatchr-tailscale
    restart: always
    # Joins the site's network (the site owns it, so a Tailscale restart never cuts the site off); its
    # tailscale serve reaches nginx on 127.0.0.1:80.
    network_mode: service:dispatchr
    depends_on: [dispatchr]
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-dispatchr}
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      # An interactive first login gets this long (the default is 1 min, then a restart with a new key);
      # once logged in, restarts reuse the saved login instead of logging in again.
      TS_BOOT_TIMEOUT: ${TS_BOOT_TIMEOUT:-15m}
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/serve.json
      TS_USERSPACE: "true"
    volumes:
      - tailscale_state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
volumes:
  tailscale_state:
