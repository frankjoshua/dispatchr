    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff3c8"/>
      <stop offset="0.42" stop-color="#ffd36e"/>
      <stop offset="1" stop-color="#a3741a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#05080f"/>
  <path d="M32 5 59 32 32 59 5 32Z" fill="none" stroke="#ffd36e" stroke-opacity="0.8" stroke-width="2.5"/>
  <path d="M32 12 52 32 32 52 12 32Z" fill="url(#gem)"/>
  <path d="M32 18.5 45.5 32 32 45.5 18.5 32Z" fill="none" stroke="#05080f" stroke-opacity="0.4" stroke-width="3"/>
